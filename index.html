<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>季度銷售數據分析 QBR</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .upload-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .upload-box {
            display: inline-block;
            width: 48%;
            margin-right: 2%;
            padding: 20px;
            border: 3px dashed #3b82f6;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-box:last-child {
            margin-right: 0;
        }
        
        .upload-box:hover {
            background: #eff6ff;
            border-color: #1e40af;
        }
        
        .upload-box h3 {
            color: #1e40af;
            margin-bottom: 10px;
        }
        
        .file-info {
            margin-top: 10px;
            color: #28a745;
            font-weight: bold;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .results {
            display: none;
        }
        
        .chart-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .chart-section h2 {
            color: #1e40af;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 30px;
        }
        
        .dual-chart-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }
        
        .chart-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
        }
        
        .chart-box h3 {
            text-align: center;
            color: #1e40af;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .filters {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
            padding: 15px 0 15px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        
        .filter-group {
            flex: 0 0 auto;
            min-width: 200px;
        }
        
        .filter-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
        
        .quick-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .quick-btn {
            padding: 10px 20px;
            border: 2px solid #3b82f6;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
        }
        
        .quick-btn:hover {
            background: #eff6ff;
        }
        
        .quick-btn.active {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            border-color: #1e40af;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .summary-card {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .summary-card h3 {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .summary-card .value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .summary-card .change {
            font-size: 14px;
        }
        
        .positive {
            color: #4ade80;
        }
        
        .negative {
            color: #f87171;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .chart-title {
            color: #1e40af;
            margin: 30px 0 15px 0;
            text-align: center;
            font-size: 1.3em;
        }
        
        .growth-table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }
        
        .growth-table-fixed {
            table-layout: fixed;
        }
        
        .growth-table-fixed thead tr {
            height: 45px;
        }
        
        .growth-table-fixed tbody tr {
            height: 55px;
        }
        
        .growth-table-fixed th,
        .growth-table-fixed td {
            vertical-align: middle;
            overflow: hidden;
        }
        
        .growth-table th {
            background: #1e40af;
            color: white;
            padding: 10px 8px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #1e3a8a;
            white-space: nowrap;
        }
        
        .growth-table td {
            padding: 8px 6px;
            text-align: center;
            border: 1px solid #e5e7eb;
            white-space: nowrap;
        }
        
        .growth-table .product-col {
            background: #f1f5f9;
            font-weight: bold;
            text-align: left;
            padding-left: 12px;
        }
        
        .growth-table .store-header {
            font-weight: bold;
            font-size: 14px;
        }
        
        .growth-table .positive-growth {
            background-color: #dcfce7;
            color: #16a34a;
            font-weight: bold;
        }
        
        .growth-table .negative-growth {
            background-color: #fee2e2;
            color: #dc2626;
            font-weight: bold;
        }
        
        .growth-table .avg-row {
            background-color: #fef3c7;
            font-weight: bold;
        }
        
        .legend-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-color {
            width: 30px;
            height: 4px;
            border-radius: 2px;
        }
        
        .app-layout {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 200px;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            padding: 20px 15px;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }
        
        .sidebar h2 {
            margin: 0 0 8px 0;
            font-size: 1.3em;
            color: white;
        }
        
        .sidebar .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 0.8em;
            margin-bottom: 20px;
        }
        
        .sidebar-section {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }
        
        .sidebar-section h3 {
            margin: 0 0 12px 0;
            font-size: 1em;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .sidebar-section label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85em;
            color: white;
            font-weight: bold;
        }
        
        .sidebar-section .file-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 6px;
        }
        
        .sidebar-section .file-btn {
            padding: 6px 10px;
            background: rgba(255,255,255,0.15);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .sidebar-section .file-btn:hover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.5);
        }
        
        .sidebar-section .file-btn.active {
            background: white;
            color: #1e40af;
            border-color: white;
        }
        
        .sidebar .btn {
            width: 100%;
            padding: 10px;
            background: white;
            color: #1e40af;
            border: none;
            font-weight: bold;
            font-size: 0.9em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .sidebar .btn:hover {
            background: rgba(255,255,255,0.9);
            transform: translateY(-2px);
        }
        
        .sidebar .btn:disabled {
            background: rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.6);
            cursor: not-allowed;
            transform: none;
        }
        
        .main-content {
            margin-left: 200px;
            flex: 1;
            padding: 40px;
            background: #f8fafc;
            min-height: 100vh;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-indicator.loading {
            background: #f59e0b;
            animation: pulse 1.5s infinite;
        }
        
        .status-indicator.ready {
            background: #22c55e;
        }
        
        .status-indicator.error {
            background: #ef4444;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 響應式設計 */
        @media screen and (max-width: 1400px) {
            .growth-table {
                font-size: 12px;
            }
            
            .growth-table th,
            .growth-table td {
                padding: 6px 4px;
            }
        }
        
        @media screen and (max-width: 768px) {
            .main-content {
                padding: 20px;
            }
            
            .growth-table {
                font-size: 11px;
            }
            
            .growth-table th,
            .growth-table td {
                padding: 4px 2px;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- 左側邊欄 -->
        <div class="sidebar">
            <h2>📊 QBR 分析工具</h2>
            <p class="subtitle">Quarterly Business Review</p>
            
            <div class="sidebar-section">
                <h3>
                    <span class="status-indicator loading" id="statusIndicator"></span>
                    檔案選擇
                </h3>
                <div style="margin-bottom: 12px;">
                    <label>📊 對比A檔案：</label>
                    <div class="file-buttons" id="fileButtonsA"></div>
                </div>
                <div style="margin-bottom: 15px; margin-top: 18px;">
                    <label>📊 對比B檔案：</label>
                    <div class="file-buttons" id="fileButtonsB"></div>
                </div>
                <button class="btn" id="analyzeGithubBtn" onclick="analyzeGithubData()" disabled>
                    🚀 開始分析
                </button>
            </div>
        </div>
        
        <!-- 右側主要內容區 -->
        <div class="main-content">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: white; font-size: 18px;">數據分析中...</p>
            </div>
            
            <div class="results" id="results">
            <!-- 人流分析 (Traffic) -->
            <div class="chart-section">
                <h2>🚶 門市人流分析</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label>選擇門市：</label>
                        <div class="quick-buttons" id="trafficStoreButtons"></div>
                    </div>
                </div>
                <div class="legend-box">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ef4444;"></div>
                        <span>75</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #3b82f6;"></div>
                        <span>76</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #10b981;"></div>
                        <span>77</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #f59e0b;"></div>
                        <span>81</span>
                    </div>
                </div>
                
                <div class="dual-chart-container">
                    <div class="chart-box">
                        <h3 id="trafficTitleA">對比A 人流趨勢</h3>
                        <div class="chart-container" style="height: 400px;">
                            <canvas id="trafficChartA"></canvas>
                        </div>
                    </div>
                    <div class="chart-box">
                        <h3 id="trafficTitleB">對比B 人流趨勢</h3>
                        <div class="chart-container" style="height: 400px;">
                            <canvas id="trafficChartB"></canvas>
                        </div>
                    </div>
                </div>
                
                <!-- 數據摘要 -->
                <div style="display: flex; gap: 20px; margin-top: 30px; align-items: flex-start;">
                    <div style="flex: 1; min-width: 0; overflow: auto;" id="trafficTableA"></div>
                    <div style="flex: 1; min-width: 0; overflow: auto;" id="trafficTableB"></div>
                </div>
            </div>
            
            <!-- 成交轉換率分析 -->
            <div class="chart-section">
                <h2>📊 成交轉換率分析</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label>選擇門市：</label>
                        <div class="quick-buttons" id="conversionStoreButtons"></div>
                    </div>
                </div>
                
                <!-- 圖表和表格並排 -->
                <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 30px; margin-top: 20px;">
                    <!-- 左側：數據表格 -->
                    <div id="conversionTable"></div>
                    
                    <!-- 右側：圖表 -->
                    <div>
                        <h3 id="conversionChartTitle" style="text-align: center; color: #1e40af; margin-bottom: 15px;"></h3>
                        <div class="chart-container" style="height: 500px;">
                            <canvas id="conversionChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 銷售數據分析 -->
            <div class="chart-section">
                <h2>銷售數據分析</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label>選擇門市：</label>
                        <div class="quick-buttons" id="storeButtons"></div>
                    </div>
                    <div class="filter-group">
                        <label>選擇品項：</label>
                        <div class="quick-buttons" id="classButtons"></div>
                    </div>
                </div>
                
                <div class="summary-cards" id="summaryCards"></div>
                
                <h3 class="chart-title">銷售趨勢對比</h3>
                
                <div class="chart-container" style="height: 450px; margin-bottom: 30px;">
                    <canvas id="trendChart"></canvas>
                </div>
                
                <!-- 周数据对比表格 -->
                <div id="weeklyDataTable" style="margin-top: 20px;"></div>
            </div>
            
            <!-- 主力產品增長率 -->
            <div class="chart-section">
                <h2>主力產品門市增長率分析</h2>
                <div style="overflow-x: auto; -webkit-overflow-scrolling: touch;">
                    <div id="growthRateTable"></div>
                </div>
            </div>
            
            <!-- 品項銷量對比 -->
            <div class="chart-section">
                <h2>品項銷量對比</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label>選擇門市：</label>
                        <div class="quick-buttons" id="comparisonStoreButtons"></div>
                    </div>
                </div>
                <div id="productComparisonSubtitle" style="text-align: center; color: #1e40af; font-size: 1.1em; margin-bottom: 20px; font-weight: bold;"></div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <h3 style="text-align: center; color: #1e40af; margin-bottom: 15px;">主力產品</h3>
                        <div class="chart-container" style="height: 350px;">
                            <canvas id="mainProductsChart"></canvas>
                        </div>
                    </div>
                    <div>
                        <h3 style="text-align: center; color: #1e40af; margin-bottom: 15px;">其他產品</h3>
                        <div class="chart-container" style="height: 350px;">
                            <canvas id="otherProductsChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Trade in 分析 -->
            <div class="chart-section">
                <h2>🔄 Trade-in % Program</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label>選擇門市：</label>
                        <div class="quick-buttons" id="tradeinStoreButtons"></div>
                    </div>
                </div>
                <div id="tradeinStoreTitle" style="text-align: center; color: #1e40af; font-size: 1.2em; margin-bottom: 20px; font-weight: bold;"></div>
                
                <!-- 圖表區域 - 左右並排 -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    <div>
                        <h3 style="text-align: center; color: #1e40af; margin-bottom: 15px;" id="tradeinTitleA">對比A</h3>
                        <div class="chart-container" style="height: 450px;">
                            <canvas id="tradeinChartA"></canvas>
                        </div>
                    </div>
                    <div>
                        <h3 style="text-align: center; color: #1e40af; margin-bottom: 15px;" id="tradeinTitleB">對比B</h3>
                        <div class="chart-container" style="height: 450px;">
                            <canvas id="tradeinChartB"></canvas>
                        </div>
                    </div>
                </div>
                
                <!-- 數據摘要區域 - 左右並排 -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div id="tradeinTableA"></div>
                    <div id="tradeinTableB"></div>
                </div>
            </div>
            
            <!-- 各品項排名 -->
            <div class="chart-section">
                <h2>各品項門市銷量排名</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label>選擇門市：</label>
                        <div class="quick-buttons" id="categoryStoreButtons"></div>
                    </div>
                </div>
                <div id="categoryStoreCharts"></div>
            </div>
            
            <!-- 各品項業績排名 -->
            <div class="chart-section">
                <h2>各品項門市業績排名</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label>選擇門市：</label>
                        <div class="quick-buttons" id="categoryRevenueStoreButtons"></div>
                    </div>
                </div>
                <div id="categoryRevenueStoreCharts"></div>
            </div>
        </div>
        
        <footer style="text-align: center; padding: 30px 20px; color: #6b7280; font-size: 0.9em; margin-top: 50px; border-top: 1px solid #e5e7eb;">
            Created by Morio © 2025
        </footer>
        </div>
    </div>

    <script>
        // 註冊ChartDataLabels插件
        Chart.register(ChartDataLabels);
        
        let dataA = null;
        let dataB = null;
        let fileNameA = '';
        let fileNameB = '';
        let charts = {};
        let selectedStore = 'all';
        let selectedClass = 'all';
        
        // 品項排序
        const classOrder = ['CPU', 'iPad', 'iPhone', 'Apple Watch', 'AirPods', 'Audio', 'Care', 'Accy', '3rd Party'];
        
        // 門市顏色配置
        const storeColors = {
            '75': '#ef4444',
            '76': '#3b82f6',
            '77': '#10b981',
            '81': '#f59e0b',
            '84': '#8b5cf6'
        };
        
        // 有人流數據的門市（排除84）
        const trafficStores = ['75', '76', '77', '81'];
        
        let githubFileList = [];
        const GITHUB_REPO_URL = 'https://github.com/moriochang/QBR/tree/main/data';
        
        // 頁面載入時自動載入GitHub檔案
        window.addEventListener('DOMContentLoaded', function() {
            autoLoadGithubFiles();
        });
        
        let selectedFileA = null;
        let selectedFileB = null;
        
        async function autoLoadGithubFiles() {
            const statusIndicator = document.getElementById('statusIndicator');
            statusIndicator.className = 'status-indicator loading';
            
            try {
                const match = GITHUB_REPO_URL.match(/github\.com\/([^\/]+)\/([^\/]+)\/tree\/([^\/]+)\/(.+)/);
                if (!match) {
                    throw new Error('URL 格式錯誤');
                }
                
                const [, owner, repo, branch, path] = match;
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
                
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`無法載入檔案 (${response.status})`);
                }
                
                const files = await response.json();
                githubFileList = Array.isArray(files) ? files.filter(f => f.name.endsWith('.xlsx') || f.name.endsWith('.xls')) : [];
                
                if (githubFileList.length === 0) {
                    throw new Error('找不到 Excel 檔案');
                }
                
                // 按檔名排序
                githubFileList.sort((a, b) => a.name.localeCompare(b.name));
                
                // 建立對比A的按鈕
                const containerA = document.getElementById('fileButtonsA');
                containerA.innerHTML = '';
                githubFileList.forEach(file => {
                    const btn = document.createElement('button');
                    btn.className = 'file-btn';
                    btn.textContent = file.name.replace('.xlsx', '').replace('.xls', '');
                    btn.onclick = () => selectFile('A', file, btn);
                    containerA.appendChild(btn);
                });
                
                // 建立對比B的按鈕
                const containerB = document.getElementById('fileButtonsB');
                containerB.innerHTML = '';
                githubFileList.forEach(file => {
                    const btn = document.createElement('button');
                    btn.className = 'file-btn';
                    btn.textContent = file.name.replace('.xlsx', '').replace('.xls', '');
                    btn.onclick = () => selectFile('B', file, btn);
                    containerB.appendChild(btn);
                });
                
                statusIndicator.className = 'status-indicator ready';
            } catch (error) {
                statusIndicator.className = 'status-indicator error';
                document.getElementById('fileButtonsA').innerHTML = '<div style="color: rgba(255,255,255,0.7); font-size: 0.85em; text-align: center; padding: 10px;">載入失敗</div>';
                document.getElementById('fileButtonsB').innerHTML = '<div style="color: rgba(255,255,255,0.7); font-size: 0.85em; text-align: center; padding: 10px;">載入失敗</div>';
                console.error('載入失敗：', error);
            }
        }
        
        function selectFile(quarter, file, button) {
            // 移除同組其他按鈕的active狀態
            const container = document.getElementById(`fileButtons${quarter}`);
            const buttons = container.querySelectorAll('.file-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // 設置當前按鈕為active
            button.classList.add('active');
            
            // 儲存選擇
            if (quarter === 'A') {
                selectedFileA = file;
            } else {
                selectedFileB = file;
            }
            
            // 檢查是否兩個都已選擇
            checkGithubSelection();
        }
        
        function checkGithubSelection() {
            const analyzeBtn = document.getElementById('analyzeGithubBtn');
            analyzeBtn.disabled = !(selectedFileA && selectedFileB);
        }
        
        async function analyzeGithubData() {
            if (!selectedFileA || !selectedFileB) return;
            
            const fileAUrl = selectedFileA.download_url;
            const fileBUrl = selectedFileB.download_url;
            const fileAName = selectedFileA.name;
            const fileBName = selectedFileB.name;
            
            document.getElementById('loading').classList.add('active');
            
            try {
                // 載入檔案A
                const responseA = await fetch(fileAUrl);
                const dataA_blob = await responseA.arrayBuffer();
                const workbookA = XLSX.read(new Uint8Array(dataA_blob), {type: 'array'});
                const firstSheetA = workbookA.Sheets[workbookA.SheetNames[0]];
                const jsonDataA = XLSX.utils.sheet_to_json(firstSheetA, {header: 1});
                dataA = processExcelData(jsonDataA);
                fileNameA = fileAName.replace(/\.[^/.]+$/, "");
                
                // 載入檔案B
                const responseB = await fetch(fileBUrl);
                const dataB_blob = await responseB.arrayBuffer();
                const workbookB = XLSX.read(new Uint8Array(dataB_blob), {type: 'array'});
                const firstSheetB = workbookB.Sheets[workbookB.SheetNames[0]];
                const jsonDataB = XLSX.utils.sheet_to_json(firstSheetB, {header: 1});
                dataB = processExcelData(jsonDataB);
                fileNameB = fileBName.replace(/\.[^/.]+$/, "");
                
                // 開始分析
                setTimeout(() => {
                    createStoreButtons();
                    createClassButtons();
                    createTrafficCharts();
                    createTradeinCharts();
                    updateCharts();
                    calculateSummary();
                    createGrowthRateTable();
                    createProductComparisonCharts();
                    createCategoryStoreCharts();
                    createCategoryRevenueStoreCharts();
                    createConversionCharts();
                    
                    document.getElementById('loading').classList.remove('active');
                    document.getElementById('results').style.display = 'block';
                }, 500);
            } catch (error) {
                document.getElementById('loading').classList.remove('active');
                alert('載入失敗：' + error.message);
                console.error(error);
            }
        }
        
        function handleFileUpload(quarter, input) {
            const file = input.files[0];
            if (file) {
                const fileName = file.name.replace(/\.[^/.]+$/, "");
                document.getElementById(`info${quarter}`).textContent = `✓ ${file.name}`;
                
                if (quarter === 'A') {
                    fileNameA = fileName;
                } else {
                    fileNameB = fileName;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
                    
                    const processedData = processExcelData(jsonData);
                    
                    if (quarter === 'A') {
                        dataA = processedData;
                    } else {
                        dataB = processedData;
                    }
                    
                    if (dataA && dataB) {
                        document.getElementById('analyzeBtn').disabled = false;
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        }
        
        function processExcelData(jsonData) {
            const result = {
                data: [],
                maxWeek: 0,
                stores: new Set(),
                classes: new Set(),
                weekDates: {}  // 新增：儲存每週的日期範圍
            };
            
            let weekNum = 0;
            let currentStore = null;
            
            for (let colIdx = 0; colIdx < jsonData[0].length; colIdx++) {
                const headerCell = jsonData[0][colIdx];
                
                if (headerCell && typeof headerCell === 'string' && headerCell.includes('W')) {
                    weekNum++;
                    
                    // 提取日期資訊（在第二行）
                    const dateCell = jsonData[1] && jsonData[1][colIdx];
                    if (dateCell) {
                        result.weekDates[weekNum] = dateCell;
                    }
                    
                    for (let rowIdx = 3; rowIdx < jsonData.length; rowIdx++) {
                        const row = jsonData[rowIdx];
                        
                        if (row[colIdx] && row[colIdx] !== 'store') {
                            const storeValue = row[colIdx];
                            if (typeof storeValue === 'number' || (typeof storeValue === 'string' && /^\d+$/.test(storeValue))) {
                                currentStore = String(storeValue);
                                result.stores.add(currentStore);
                            }
                        }
                        
                        const classValue = row[colIdx + 1];
                        if (classValue && currentStore) {
                            const qty = parseFloat(row[colIdx + 2]) || 0;
                            const revenue = parseFloat(row[colIdx + 3]) || 0;
                            
                            result.classes.add(classValue);
                            
                            result.data.push({
                                weekNum: weekNum,
                                store: currentStore,
                                class: classValue,
                                qty: qty,
                                revenue: revenue
                            });
                        }
                    }
                    
                    result.maxWeek = weekNum;
                }
            }
            
            return result;
        }
        
        function analyzeData() {
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').style.display = 'none';
            
            setTimeout(() => {
                createStoreButtons();
                createClassButtons();
                createTrafficCharts();
                createTradeinCharts();
                updateCharts();
                calculateSummary();
                createGrowthRateTable();
                createProductComparisonCharts();
                createCategoryStoreCharts();
                createCategoryRevenueStoreCharts();
                createConversionCharts();
                
                document.getElementById('loading').classList.remove('active');
                document.getElementById('results').style.display = 'block';
            }, 500);
        }
        
        function createTrafficCharts() {
            // 更新標題
            document.getElementById('trafficTitleA').textContent = `${fileNameA} 人流趨勢`;
            document.getElementById('trafficTitleB').textContent = `${fileNameB} 人流趨勢`;
            
            // 決定要顯示的門市
            const storesToShow = selectedStore === 'all' ? trafficStores : [selectedStore];
            
            // 找出兩個數據集的最大值和最小值，用於統一Y軸範圍
            let globalMax = 0;
            let globalMin = Infinity;
            
            storesToShow.forEach(store => {
                for (let week = 1; week <= Math.max(dataA.maxWeek, dataB.maxWeek); week++) {
                    const weekDataA = dataA.data.find(d => d.store === store && d.class === 'Traffic' && d.weekNum === week);
                    const weekDataB = dataB.data.find(d => d.store === store && d.class === 'Traffic' && d.weekNum === week);
                    
                    if (weekDataA && weekDataA.qty > 0) {
                        globalMax = Math.max(globalMax, weekDataA.qty);
                        globalMin = Math.min(globalMin, weekDataA.qty);
                    }
                    if (weekDataB && weekDataB.qty > 0) {
                        globalMax = Math.max(globalMax, weekDataB.qty);
                        globalMin = Math.min(globalMin, weekDataB.qty);
                    }
                }
            });
            
            // 設定統一的Y軸範圍
            const yAxisMin = Math.max(100, Math.floor(globalMin / 100) * 100);
            const yAxisMax = Math.ceil(globalMax * 1.1);
            
            // 創建對比A的人流圖表
            createTrafficChart('trafficChartA', dataA, storesToShow, fileNameA, yAxisMin, yAxisMax);
            
            // 創建對比B的人流圖表
            createTrafficChart('trafficChartB', dataB, storesToShow, fileNameB, yAxisMin, yAxisMax);
            
            // 創建數據摘要表格
            createTrafficSummaryTable('trafficTableA', dataA, storesToShow, fileNameA, null, selectedStore);
            createTrafficSummaryTable('trafficTableB', dataB, storesToShow, fileNameB, dataA, selectedStore);
        }
        
        function createTrafficSummaryTable(tableId, data, stores, title, compareData, currentStore) {
            const maxWeek = data.maxWeek;
            
            // 先收集每家门市的所有数据，找出最高和最低值
            const storeData = {};
            stores.forEach(store => {
                storeData[store] = [];
                for (let week = 1; week <= maxWeek; week++) {
                    const weekData = data.data.find(d => 
                        d.store === store && 
                        d.class === 'Traffic' && 
                        d.weekNum === week
                    );
                    const qty = weekData ? weekData.qty : 0;
                    storeData[store].push(qty);
                }
            });
            
            // 找出每家门市的最高和最低值
            const storeMaxMin = {};
            stores.forEach(store => {
                const values = storeData[store].filter(v => v > 0);
                storeMaxMin[store] = {
                    max: Math.max(...values),
                    min: Math.min(...values)
                };
            });
            
            let tableHTML = `
                <h4 style="color: #1e40af; margin-bottom: 10px; ${currentStore === 'all' ? 'height: 30px; line-height: 30px;' : ''}">數據摘要 - ${title}</h4>
                <table class="growth-table ${currentStore === 'all' ? 'growth-table-fixed' : ''}">
                    <thead>
                        <tr>
                            <th style="${currentStore === 'all' ? 'width: 10%;' : 'min-width: 60px;'}">Week</th>
                            <th style="${currentStore === 'all' ? 'width: 15%;' : 'min-width: 120px;'}">日期區間</th>`;
            
            if (currentStore === 'all') {
                // 全部門市模式：使用固定百分比寬度確保對齊
                const storeWidth = (60 / stores.length).toFixed(1);
                stores.forEach(store => {
                    tableHTML += `<th style="width: ${storeWidth}%;">${store}</th>`;
                });
                
                if (stores.length > 1) {
                    tableHTML += '<th style="width: 15%;">總計</th>';
                }
            } else {
                // 單門市模式：使用min-width響應式
                stores.forEach(store => {
                    tableHTML += `<th style="min-width: 100px;">${store}</th>`;
                });
                
                if (stores.length > 1) {
                    tableHTML += '<th style="min-width: 90px;">總計</th>';
                }
            }
            
            // 单个门市时，统一增加增长率数据列和增长率图表列
            if (stores.length === 1) {
                tableHTML += '<th style="background: #3b82f6; color: white; min-width: 100px;">增長率</th>';
                tableHTML += '<th style="background: #3b82f6; color: white; min-width: 150px;">增長率圖表</th>';
            }
            
            tableHTML += `</tr>
                    </thead>
                    <tbody>`;
            
            // 初始化总计变量
            const grandTotal = {};
            const grandTotalCompare = {};
            stores.forEach(store => {
                grandTotal[store] = 0;
                grandTotalCompare[store] = 0;
            });
            let allStoresTotal = 0;
            let allStoresTotalCompare = 0;
            
            for (let week = 1; week <= maxWeek; week++) {
                tableHTML += `<tr>
                    <td style="font-weight: bold; text-align: center;">W${week}</td>
                    <td style="text-align: center;">${data.weekDates[week] || ''}</td>`;
                
                let weekTotal = 0;
                let weekTotalCompare = 0;
                let singleStoreGrowthData = null; // 存储单门市的增长率数据
                
                stores.forEach(store => {
                    const weekData = data.data.find(d => 
                        d.store === store && 
                        d.class === 'Traffic' && 
                        d.weekNum === week
                    );
                    const qty = weekData ? weekData.qty : 0;
                    weekTotal += qty;
                    grandTotal[store] += qty;  // 累加到总计
                    
                    // 根据是否为最高或最低值设置颜色
                    let color = '#000';
                    if (qty === storeMaxMin[store].max && qty > 0) {
                        color = '#ef4444';  // 红色 - 最高
                    } else if (qty === storeMaxMin[store].min && qty > 0) {
                        color = '#3b82f6';  // 蓝色 - 最低
                    }
                    
                    let cellContent = `<span style="color: ${color}; font-weight: ${qty === storeMaxMin[store].max || qty === storeMaxMin[store].min ? 'bold' : 'normal'};">${qty.toLocaleString()}</span>`;
                    
                    // 如果有比较数据
                    if (compareData) {
                        const compareWeekData = compareData.data.find(d => 
                            d.store === store && 
                            d.class === 'Traffic' && 
                            d.weekNum === week
                        );
                        const compareQty = compareWeekData ? compareWeekData.qty : 0;
                        weekTotalCompare += compareQty;
                        grandTotalCompare[store] += compareQty;  // 累加到对比总计
                        
                        if (compareQty > 0) {
                            const growth = ((qty - compareQty) / compareQty * 100).toFixed(1);
                            const growthNum = parseFloat(growth);
                            
                            if (stores.length === 1) {
                                // 单门市：保存增长率数据，稍后在独立列显示
                                singleStoreGrowthData = { growth, growthNum };
                            } else if (growthNum !== 0 && currentStore !== 'all') {
                                // 多门市且非全部门市模式：将增长率显示在数字下方

                                                    <span style="color: #000000; font-weight: bold; font-size: 0.7em; position: absolute; left: 4px; line-height: 16px;">${sign}${Math.abs(growth)}%</span>
                                                </div>
                                            </div>

                            tableHTML += `<td style="text-align: center; color: ${textColor}; font-weight: bold;">${symbol} ${sign}${growth}%</td>`;
                        } else {
                            tableHTML += `<td style="text-align: center; color: #6b7280;">0.0%</td>`;

                        // 第二欄：增長率圖表（條形圖，不顯示數字）
                        if (growthNum !== 0) {
                            const isGrowth = growthNum > 0;
                            const barColor = isGrowth ? '#22c55e' : '#ef4444';
                            const barWidth = Math.min(Math.abs(growthNum), 100);
                            
                            const growthCellContent = `

        function createTrafficChart(canvasId, data, stores, title, yMin, yMax) {
            const maxWeek = data.maxWeek;
            const weeks = Array.from({length: maxWeek}, (_, i) => `W${i + 1}`);
            
            const datasets = stores.map(store => {
                const trafficData = [];
                for (let week = 1; week <= maxWeek; week++) {
                    const weekData = data.data.find(d => 
                        d.store === store && 
                        d.class === 'Traffic' && 
                        d.weekNum === week
                    );
                    trafficData.push(weekData ? weekData.qty : 0);
                }
                
                // 找出最高和最低值的索引
                const maxValue = Math.max(...trafficData);
                const minValue = Math.min(...trafficData.filter(v => v > 0));
                const maxIndex = trafficData.indexOf(maxValue);
                const minIndex = trafficData.indexOf(minValue);
                
                return {
                    label: `${store}`,
                    data: trafficData,
                    borderColor: storeColors[store],
                    backgroundColor: storeColors[store] + '20',
                    tension: 0.4,
                    fill: false,
                    pointRadius: function(context) {
                        const index = context.dataIndex;
                        if (index === maxIndex || index === minIndex) return 7;
                        return 4;
                    },
                    pointHoverRadius: 9,
                    borderWidth: 3,
                    pointStyle: function(context) {
                        const index = context.dataIndex;
                        if (index === maxIndex) return 'rect';  // 正方形
                        if (index === minIndex) return 'triangle';  // 倒三角形
                        return 'circle';  // 圆形
                    },
                    pointBackgroundColor: function(context) {
                        const index = context.dataIndex;
                        if (index === maxIndex || index === minIndex) {
                            return storeColors[store];  // 实心
                        }
                        return 'rgba(255, 255, 255, 0)';  // 空心（透明）
                    },
                    pointBorderColor: storeColors[store],
                    pointBorderWidth: 2,
                    pointRotation: function(context) {
                        const index = context.dataIndex;
                        if (index === minIndex) return 180;  // 倒三角形旋转180度
                        return 0;
                    },
                    datalabels: {
                        display: false
                    }
                };
            });
            
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }
            
            charts[canvasId] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: weeks,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toLocaleString() + ' 人';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            type: 'logarithmic',
                            beginAtZero: false,
                            min: yMin,
                            max: yMax,
                            ticks: {
                                callback: function(value) {
                                    if (value === 100 || value === 1000 || value === 10000 || value === 100000) {
                                        return value.toLocaleString();
                                    }
                                    return '';
                                }
                            },
                            title: {
                                display: true,
                                text: '人流數（對數刻度）',
                                font: {
                                    size: 14,
                                    weight: 'bold'
                                }
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '週數',
                                font: {
                                    size: 14,
                                    weight: 'bold'
                                }
                            }
                        }
                    }
                }
            });
        }

        function createStoreButtons() {

            // 創建品項業績排名的門市按鈕
            createStoreButtonsForContainer('categoryRevenueStoreButtons', stores);
            // 創建品項銷量對比的門市按鈕
            createStoreButtonsForContainer('comparisonStoreButtons', stores);
            // 創建Trade-in的門市按鈕
            createStoreButtonsForContainer('tradeinStoreButtons', stores);
            // 創建成交轉換率的門市按鈕
            createStoreButtonsForContainer('conversionStoreButtons', stores);

        function createStoreButtonsForContainer(containerId, stores) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.innerHTML = '';
            
            const allBtn = document.createElement('button');
            allBtn.className = 'quick-btn active';
            allBtn.textContent = '全部門市';
            allBtn.onclick = () => selectStore('all');
            container.appendChild(allBtn);
            
            stores.forEach(store => {
                const btn = document.createElement('button');
                btn.className = 'quick-btn';
                btn.textContent = `${store}`;
                btn.onclick = () => selectStore(store);
                container.appendChild(btn);
            });
        }
        
        function createClassButtons() {
            // 排除 Traffic 和 Trade in
            const classes = Array.from(dataA.classes).filter(c => c !== 'Traffic' && c !== 'Trade in');
            const sortedClasses = classes.sort((a, b) => {
                const indexA = classOrder.indexOf(a);
                const indexB = classOrder.indexOf(b);
                if (indexA === -1 && indexB === -1) return 0;
                if (indexA === -1) return 1;
                if (indexB === -1) return -1;
                return indexA - indexB;
            });
            
            const classButtonsDiv = document.getElementById('classButtons');
            classButtonsDiv.innerHTML = '';
            
            const allBtn = document.createElement('button');
            allBtn.className = 'quick-btn active';
            allBtn.textContent = '全部品項';
            allBtn.onclick = () => selectClass('all');
            classButtonsDiv.appendChild(allBtn);
            
            sortedClasses.forEach(cls => {
                const btn = document.createElement('button');
                btn.className = 'quick-btn';
                btn.textContent = cls;
                btn.onclick = () => selectClass(cls);
                classButtonsDiv.appendChild(btn);
            });

        function selectStore(store) {
            selectedStore = store;
            
            // 更新所有容器的按鈕狀態
            ['storeButtons', 'trafficStoreButtons', 'categoryStoreButtons', 'categoryRevenueStoreButtons', 'comparisonStoreButtons', 'tradeinStoreButtons', 'conversionStoreButtons'].forEach(containerId => {
                const container = document.getElementById(containerId);
                if (container) {
                    container.querySelectorAll('.quick-btn').forEach(btn => btn.classList.remove('active'));
                    
                    // 找到對應的按鈕並激活
                    Array.from(container.querySelectorAll('.quick-btn')).forEach(btn => {
                        if ((store === 'all' && btn.textContent === '全部門市') || 
                            (store !== 'all' && btn.textContent === store)) {
                            btn.classList.add('active');
                        }
                    });
                }
            });
            
            // 更新所有相關圖表
            updateCharts();
            calculateSummary();
            createProductComparisonCharts();
            createTradeinCharts();
            createTrafficCharts();
            createCategoryStoreCharts();
            createCategoryRevenueStoreCharts();
            createConversionCharts();
        }
        
        function selectClass(cls) {
            selectedClass = cls;
            document.querySelectorAll('#classButtons .quick-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateCharts();
            calculateSummary();
        }
        
        function getComparableWeeks() {
            return Math.min(dataA.maxWeek, dataB.maxWeek);
        }
        
        function updateCharts() {
            const comparableWeeks = getComparableWeeks();
            const weeks = Array.from({length: comparableWeeks}, (_, i) => `W${i + 1}`);
            
            let filteredA = dataA.data.filter(d => d.weekNum <= comparableWeeks && d.class !== 'Traffic' && d.class !== 'Trade in');
            let filteredB = dataB.data.filter(d => d.weekNum <= comparableWeeks && d.class !== 'Traffic' && d.class !== 'Trade in');
            
            if (selectedStore !== 'all') {
                filteredA = filteredA.filter(d => d.store == selectedStore);
                filteredB = filteredB.filter(d => d.store == selectedStore);
            }
            
            if (selectedClass !== 'all') {
                filteredA = filteredA.filter(d => d.class === selectedClass);
                filteredB = filteredB.filter(d => d.class === selectedClass);
            }
            
            const qtyA = weeks.map((_, weekIdx) => {
                return filteredA
                    .filter(d => d.weekNum === weekIdx + 1)
                    .reduce((sum, d) => sum + (parseFloat(d.qty) || 0), 0);
            });
            
            const qtyB = weeks.map((_, weekIdx) => {
                return filteredB
                    .filter(d => d.weekNum === weekIdx + 1)
                    .reduce((sum, d) => sum + (parseFloat(d.qty) || 0), 0);
            });
            
            // 計算對比A的最高和最低值索引
            const maxQtyA = Math.max(...qtyA);
            const minQtyA = Math.min(...qtyA);

            const minIndexA = qtyA.indexOf(minQtyA);

            const maxQtyB = Math.max(...qtyB);
            const minQtyB = Math.min(...qtyB);
            const maxIndexB = qtyB.indexOf(maxQtyB);
            const minIndexB = qtyB.indexOf(minQtyB);
            
            const avgQtyA = qtyA.reduce((a, b) => a + b, 0) / qtyA.length;
            const avgQtyB = qtyB.reduce((a, b) => a + b, 0) / qtyB.length;
            const avgLineA = weeks.map(() => avgQtyA);
            const avgLineB = weeks.map(() => avgQtyB);

                            pointBackgroundColor: function(context) {

                                if (index === minIndexA) return '#3b82f6';  // 藍色實心
                                return '#22c55e';  // 綠色實心
                            },
                            pointBorderColor: function(context) {
                                const index = context.dataIndex;
                                if (index === maxIndexA) return '#ef4444';
                                if (index === minIndexA) return '#3b82f6';
                                return '#22c55e';
                            },
                            datalabels: {
                                align: function(context) {
                                    const value = context.dataset.data[context.dataIndex];
                                    const maxValue = Math.max(...context.dataset.data);
                                    return value >= maxValue * 0.9 ? 'bottom' : 'top';
                                },

                                formatter: function(value) {
                                    return value > 0 ? value.toLocaleString() : '';

                        {

        // ========== 成交轉換率分析函數 ==========
        function createConversionCharts() {
            const comparableWeeks = getComparableWeeks();
            const mainProducts = ['CPU', 'iPad', 'iPhone', 'Apple Watch', 'AirPods'];
            const stores = ['75', '76', '77', '81', '84'];
            
            // 更新標題
            const titleElement = document.getElementById('conversionChartTitle');
            if (titleElement) {
                if (selectedStore === 'all') {
                    titleElement.textContent = `全部門市 - 成交轉換率`;
                } else {
                    titleElement.textContent = `門市 ${selectedStore} - 成交轉換率`;
                }
            }
            
            // 準備數據
            const weeks = [];
            const trafficDataA = [];
            const trafficDataB = [];
            const mainProductQtyA = [];
            const mainProductQtyB = [];
            const conversionRateA = [];
            const conversionRateB = [];
            
            for (let week = 1; week <= comparableWeeks; week++) {
                weeks.push(`W${week}`);
                
                let traffic_qty_A = 0;
                let traffic_qty_B = 0;
                let mainQtyA = 0;
                let mainQtyB = 0;
                
                if (selectedStore === 'all') {
                    // 全部門市：加總所有門市的數據
                    stores.forEach(store => {
                        // 對比A的人流
                        const trafficA = dataA.data.find(d => 
                            d.store == store && 
                            d.class === 'Traffic' && 
                            d.weekNum === week
                        );
                        traffic_qty_A += trafficA ? trafficA.qty : 0;
                        
                        // 對比A的五大主機
                        mainProducts.forEach(product => {
                            const item = dataA.data.find(d => 
                                d.store == store && 
                                d.class === product && 
                                d.weekNum === week
                            );
                            mainQtyA += item ? item.qty : 0;
                        });
                        
                        // 對比B的人流
                        const trafficB = dataB.data.find(d => 
                            d.store == store && 
                            d.class === 'Traffic' && 
                            d.weekNum === week
                        );
                        traffic_qty_B += trafficB ? trafficB.qty : 0;
                        
                        // 對比B的五大主機
                        mainProducts.forEach(product => {
                            const item = dataB.data.find(d => 
                                d.store == store && 
                                d.class === product && 
                                d.weekNum === week
                            );
                            mainQtyB += item ? item.qty : 0;
                        });
                    });
                } else {
                    // 單個門市
                    const targetStore = selectedStore;
                    
                    // 對比A的數據
                    const trafficA = dataA.data.find(d => 
                        d.store == targetStore && 
                        d.class === 'Traffic' && 
                        d.weekNum === week
                    );
                    traffic_qty_A = trafficA ? trafficA.qty : 0;
                    
                    // 計算對比A的五大主機總和
                    mainQtyA = mainProducts.reduce((sum, product) => {
                        const item = dataA.data.find(d => 
                            d.store == targetStore && 
                            d.class === product && 
                            d.weekNum === week
                        );
                        return sum + (item ? item.qty : 0);
                    }, 0);
                    
                    // 對比B的數據
                    const trafficB = dataB.data.find(d => 
                        d.store == targetStore && 
                        d.class === 'Traffic' && 
                        d.weekNum === week
                    );
                    traffic_qty_B = trafficB ? trafficB.qty : 0;
                    
                    // 計算對比B的五大主機總和
                    mainQtyB = mainProducts.reduce((sum, product) => {
                        const item = dataB.data.find(d => 
                            d.store == targetStore && 
                            d.class === product && 
                            d.weekNum === week
                        );
                        return sum + (item ? item.qty : 0);
                    }, 0);
                }
                
                trafficDataA.push(traffic_qty_A);
                mainProductQtyA.push(mainQtyA);
                
                trafficDataB.push(traffic_qty_B);
                mainProductQtyB.push(mainQtyB);
                
                // 計算轉換率
                const rateA = traffic_qty_A > 0 ? (mainQtyA / traffic_qty_A * 100) : 0;
                conversionRateA.push(parseFloat(rateA.toFixed(1)));
                
                const rateB = traffic_qty_B > 0 ? (mainQtyB / traffic_qty_B * 100) : 0;
                conversionRateB.push(parseFloat(rateB.toFixed(1)));
            }
            
            // 創建圖表
            createConversionChart('conversionChart', weeks, trafficDataB, conversionRateB);
            
            // 創建表格
            createConversionTable('conversionTable', weeks, trafficDataA, trafficDataB, 
                mainProductQtyA, mainProductQtyB, conversionRateA, conversionRateB);
        }

        function createProductChart(canvasId, products, comparableWeeks) {
            const qtyDataA = [];
            const qtyDataB = [];
            const growthRates = [];
            
            products.forEach(product => {
                let filteredA = dataA.data.filter(d => d.class === product && d.weekNum <= comparableWeeks);
                let filteredB = dataB.data.filter(d => d.class === product && d.weekNum <= comparableWeeks);
                
                if (selectedStore !== 'all') {
                    filteredA = filteredA.filter(d => d.store == selectedStore);
                    filteredB = filteredB.filter(d => d.store == selectedStore);
                }
                
                const qtyA = filteredA.reduce((sum, d) => sum + (parseFloat(d.qty) || 0), 0);
                const qtyB = filteredB.reduce((sum, d) => sum + (parseFloat(d.qty) || 0), 0);
                
                qtyDataA.push(qtyA);
                qtyDataB.push(qtyB);
                
                // 計算成長率
                let growthRate = 0;
                if (qtyA > 0) {
                    growthRate = ((qtyB - qtyA) / qtyA * 100).toFixed(1);
                }
                growthRates.push(parseFloat(growthRate));
            });
            
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }
            
            charts[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: products,
                    datasets: [
                        {
                            label: fileNameA,
                            data: qtyDataA,
                            backgroundColor: '#22c55e',
                            datalabels: {
                                anchor: 'end',
                                align: 'top',
                                color: '#22c55e',
                                font: {
                                    weight: 'bold',
                                    size: 11
                                },
                                formatter: function(value) {
                                    return value > 0 ? value.toLocaleString() : '';
                                }
                            }
                        },
                        {
                            label: fileNameB,
                            data: qtyDataB,
                            backgroundColor: '#f97316',
                            datalabels: {
                                anchor: 'end',
                                align: 'top',
                                color: '#f97316',
                                font: {
                                    weight: 'bold',
                                    size: 11
                                },
                                formatter: function(value) {
                                    return value > 0 ? value.toLocaleString() : '';
                                }
                            }
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            top: 30,
                            bottom: 80
                        }
                    },
                    plugins: {
                        legend: {
                            display: true
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toLocaleString() + ' 件';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                padding: 10,
                                font: {
                                    weight: 'bold'
                                }
                            }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString();
                                }
                            }
                        }
                    }
                },
                plugins: [{
                    afterDraw: function(chart) {
                        const ctx = chart.ctx;
                        const xAxis = chart.scales.x;
                        const yAxis = chart.scales.y;
                        
                        ctx.textAlign = 'center';
                        
                        products.forEach((product, index) => {
                            const growth = growthRates[index];
                            const qtyA = qtyDataA[index];
                            const qtyB = qtyDataB[index];
                            const qtyDiff = qtyB - qtyA;
                            
                            if (growth !== 0) {
                                const symbol = growth > 0 ? '▲' : '▼';
                                const color = growth > 0 ? '#22c55e' : '#ef4444';
                                
                                const x = xAxis.getPixelForValue(index);
                                const baseY = yAxis.bottom + 50; // 增加到50px，避免遮挡品项名称
                                
                                // 绘制数量增减（第一行）
                                ctx.fillStyle = color;
                                ctx.font = 'bold 12px Arial';
                                const diffText = qtyDiff > 0 ? `+${qtyDiff.toLocaleString()}` : qtyDiff.toLocaleString();
                                ctx.fillText(diffText, x, baseY);
                                
                                // 绘制成长率符号和百分比（第二行）
                                ctx.font = 'bold 12px Arial';
                                ctx.fillText(`${symbol} ${growth > 0 ? '+' : ''}${growth}%`, x, baseY + 16);
                            }
                        });
                    }
                }]
            });
        }
